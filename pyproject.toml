[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visioninspect"
version = "0.1.0"
description = "Deterministic image inspection using explicit rule-based checks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0,<12"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
visioninspect = "visioninspect.cli:main"

[tool.setuptools.packages.find]
include = ["visioninspect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
